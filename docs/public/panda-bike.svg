<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    首页 hero 动画：熊猫骑自行车

    动效说明：
    - 车轮旋转、地面虚线滚动            → 表现前进
    - 曲柄与踏板绕中轴顺时针旋转         → 踩踏感
    - 大腿、小腿分别绕髋/膝旋转          → 脚始终踩在踏板上

    关于「脚和踏板不分离」：
    踏板在半径 12 的圆上运动，这里按反向运动学解出曲柄每转 45°
    时对应的髋、膝角度（大腿 / 小腿各 8 个关键帧）。
    注意关键帧顺序为「下 → 左 → 上 → 右」，与曲柄的顺时针方向一致。

    作为 <img> 引入时，内部动画依然会播放。
  -->
  <style>
    .wheel {
      transform-box: view-box;
      animation: spin 1.3s linear infinite;
    }
    .wheel-back {
      transform-origin: 52px 142px;
    }
    .wheel-front {
      transform-origin: 148px 142px;
    }
    .body {
      animation: bob 0.65s ease-in-out infinite;
    }
    .ground {
      animation: dash 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes bob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -22;
      }
    }
  </style>

  <!-- 地面 -->
  <line
    class="ground"
    x1="0"
    y1="173"
    x2="200"
    y2="173"
    stroke="#d0d0d0"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="12 10"
  />

  <!-- 后轮 -->
  <!-- far-side leg: behind frame, static -->
  <g>
    <line x1="95" y1="142" x2="95" y2="130" stroke="#555" stroke-width="5" stroke-linecap="round" />
    <rect x="87" y="127.5" width="16" height="5" rx="2.5" fill="#555" />
    <line x1="88" y1="114" x2="99" y2="128" stroke="#555" stroke-width="12" stroke-linecap="round" />
    <line x1="99" y1="128" x2="95" y2="131" stroke="#555" stroke-width="10" stroke-linecap="round" />
    <ellipse cx="95" cy="131" rx="9" ry="6.5" fill="#555" />
  </g>

  <g class="wheel wheel-back">
    <circle cx="52" cy="142" r="28" fill="none" stroke="#2b2b2b" stroke-width="5" />
    <g stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round">
      <line x1="52" y1="119" x2="52" y2="165" />
      <line x1="29" y1="142" x2="75" y2="142" />
      <line x1="36" y1="126" x2="68" y2="158" />
      <line x1="68" y1="126" x2="36" y2="158" />
    </g>
  </g>

  <!-- 前轮 -->
  <g class="wheel wheel-front">
    <circle cx="148" cy="142" r="28" fill="none" stroke="#2b2b2b" stroke-width="5" />
    <g stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round">
      <line x1="148" y1="119" x2="148" y2="165" />
      <line x1="125" y1="142" x2="171" y2="142" />
      <line x1="132" y1="126" x2="164" y2="158" />
      <line x1="164" y1="126" x2="132" y2="158" />
    </g>
  </g>

  <!-- 车架 -->
  <g
    fill="none"
    stroke="#3451b2"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M52 142 L95 142" />
    <path d="M52 142 L84 102" />
    <path d="M95 142 L84 102" />
    <path d="M84 102 L140 102" />
    <path d="M95 142 L137 111" />
    <path d="M140 102 L148 142" />
    <path d="M140 102 L147 92" />
    <path d="M137 92 L159 92" />
  </g>

  <!-- 车座 -->
  <path
    d="M74 100 q10 -7 20 0"
    stroke="#2b2b2b"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
  />

  <!-- 曲柄与踏板：绕中轴 (95,142) 顺时针旋转 -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 95 142; 360 95 142"
      dur="1.3s"
      repeatCount="indefinite"
    />
    <line x1="95" y1="142" x2="95" y2="154" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" />
    <rect x="87" y="151.5" width="16" height="5" rx="2.5" fill="#2b2b2b" />
  </g>
  <!-- 中轴 -->
  <circle cx="95" cy="142" r="4" fill="#2b2b2b" />

  <!-- 腿：大腿绕髋 (88,114)，小腿绕膝 (99.84,132.55)，脚随之贴合踏板 -->
  <g>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 88 114; 1 88 114; -7.03 88 114; -26.65 88 114; -57.69 88 114; -61.41 88 114; -41.31 88 114; -16.15 88 114; 0 88 114"
      dur="1.3s"
      repeatCount="indefinite"
    />
    <line
      x1="88"
      y1="114"
      x2="99.84"
      y2="132.55"
      stroke="#2b2b2b"
      stroke-width="13"
      stroke-linecap="round"
    />
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 99.84 132.55; 22.53 99.84 132.55; 54.19 99.84 132.55; 81.97 99.84 132.55; 87.97 99.84 132.55; 65.76 99.84 132.55; 34.16 99.84 132.55; 6.15 99.84 132.55; 0 99.84 132.55"
        dur="1.3s"
        repeatCount="indefinite"
      />
      <line
        x1="99.84"
        y1="132.55"
        x2="95"
        y2="153"
        stroke="#2b2b2b"
        stroke-width="11"
        stroke-linecap="round"
      />
      <!-- 脚：始终压在踏板上 -->
      <ellipse cx="95" cy="152" rx="9" ry="6.5" fill="#2b2b2b" />
    </g>
  </g>

  <!-- 手臂（固定：手扶车把） -->
  <path
    d="M108 100 L140 93"
    stroke="#2b2b2b"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 身体与头（起伏，遮住四肢根部） -->
  <g class="body">
    <circle cx="82" cy="46" r="9" fill="#2b2b2b" />
    <circle cx="114" cy="46" r="9" fill="#2b2b2b" />
    <ellipse cx="96" cy="100" rx="24" ry="26" fill="#ffffff" stroke="#2b2b2b" stroke-width="4" />
    <circle cx="98" cy="64" r="23" fill="#ffffff" stroke="#2b2b2b" stroke-width="4" />
    <ellipse cx="89" cy="62" rx="6.5" ry="8" fill="#2b2b2b" transform="rotate(-18 89 62)" />
    <ellipse cx="107" cy="62" rx="6.5" ry="8" fill="#2b2b2b" transform="rotate(18 107 62)" />
    <circle cx="90" cy="61" r="2.6" fill="#ffffff" />
    <circle cx="108" cy="61" r="2.6" fill="#ffffff" />
    <ellipse cx="98" cy="74" rx="3.6" ry="2.6" fill="#2b2b2b" />
  </g>
</svg>
