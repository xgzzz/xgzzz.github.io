<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    BearCookie favicon：蓝色渐变圆角底 + 白色小熊剪影
    在 16x16 下依然可辨识（熊头 + 双耳的轮廓）
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b78d9"/>
      <stop offset="1" stop-color="#3451b2"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 小熊：双耳 + 圆头 -->
  <g fill="#ffffff">
    <circle cx="18" cy="18" r="8"/>
    <circle cx="46" cy="18" r="8"/>
    <circle cx="32" cy="38" r="17"/>
  </g>

  <!-- 眼睛与鼻子 -->
  <circle cx="25" cy="35" r="2.6" fill="#3451b2"/>
  <circle cx="39" cy="35" r="2.6" fill="#3451b2"/>
  <ellipse cx="32" cy="43" rx="3.6" ry="2.8" fill="#3451b2"/>
</svg>
